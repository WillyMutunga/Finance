version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: school_finance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-William#20}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: school_finance_backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: finance
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-William#20}
      APP_ENV: production
      APP_DEBUG: false
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - database
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: school_finance_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge